name: Nightly encrypted backup
on:
  schedule:
    - cron: "40 21 * * *" # 03:40 Dhaka
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump, encrypt, upload
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Backup secrets not configured; skipping."; exit 0
          fi
          docker run --rm postgres:17 pg_dump "$SUPABASE_DB_URL" \
            --schema=sim --schema=social --schema=app --schema=llm --schema=secrets \
            --no-owner --no-privileges -Fc > eon.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o eon.dump.gpg eon.dump
          rm eon.dump
          ls -lh eon.dump.gpg
      - uses: actions/upload-artifact@v4
        if: hashFiles('eon.dump.gpg') != ''
        with:
          name: eon-backup-${{ github.run_id }}
          path: eon.dump.gpg
          retention-days: 7
